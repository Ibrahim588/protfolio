<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 90" fill="none" className="w-auto h-12">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7E7B4" />
      <stop offset="35%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#AA7C1E" />
      <stop offset="100%" stop-color="#F3DC9B" />
    </linearGradient>
    <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#AA7C1E" />
      <stop offset="50%" stop-color="#F5E4B3" />
      <stop offset="100%" stop-color="#AA7C1E" />
    </linearGradient>
  </defs>

  <!-- Emblem / Crest -->
  <g transform="translate(10, 5)">
    <!-- Outer ornate diamond / octagonal ring -->
    <rect x="5" y="5" width="70" height="70" rx="14" transform="rotate(45 40 40)" stroke="url(#goldRing)" stroke-width="1.2" fill="#181210" fill-opacity="0.9" />
    <rect x="11" y="11" width="58" height="58" rx="10" transform="rotate(45 40 40)" stroke="url(#goldGrad)" stroke-width="0.8" stroke-dasharray="2 3" fill="none" opacity="0.8" />
    
    <!-- Stylized Monogram "DU" in Haute Serif -->
    <text x="40" y="47" font-family="'Playfair Display', 'Cormorant Garamond', serif" font-size="29" font-weight="700" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="1">DU</text>
    
    <!-- Cocoa Pod / Royal Crown accent at top -->
    <path d="M40 18 C37 21 34 23 40 25 C46 23 43 21 40 18 Z" fill="url(#goldGrad)" />
    <!-- Small star / diamond at bottom -->
    <circle cx="40" cy="57" r="1.5" fill="url(#goldGrad)" />
  </g>

  <!-- Typography: English & Arabic Luxury Pairing -->
  <g transform="translate(95, 20)">
    <!-- Brand Title Latin -->
    <text x="0" y="24" font-family="'Playfair Display', 'Cormorant Garamond', 'Cinzel', serif" font-size="23" font-weight="700" letter-spacing="3.5" fill="url(#goldGrad)">
      DU BOUTIQUE
    </text>
    <!-- Subtitle Latin -->
    <text x="1" y="40" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="500" letter-spacing="4" fill="#C9BA9B">
      CHOCOLATE &amp; HOSPITALITY
    </text>
    <!-- Arabic Brand name -->
    <text x="210" y="25" font-family="'Amiri', 'Cairo', serif" font-size="18" font-weight="700" fill="#E8D29F" text-anchor="end" letter-spacing="0.5">
      بوتيك ديو
    </text>
    <text x="210" y="40" font-family="'Tajawal', 'Cairo', sans-serif" font-size="8.5" font-weight="400" fill="#A89B88" text-anchor="end" letter-spacing="1">
      شوكولاتة بلجيكية فاخرة • جدة
    </text>
  </g>
</svg>
