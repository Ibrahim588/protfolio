<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 90" width="100%" height="100%">
  <defs>
    <linearGradient id="logoGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E3B3" />
      <stop offset="35%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#B8860B" />
      <stop offset="100%" stop-color="#8B6914" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#281A12" />
      <stop offset="100%" stop-color="#140D09" />
    </linearGradient>
  </defs>
  
  <!-- Icon Emblem -->
  <g transform="translate(45, 45)">
    <circle cx="0" cy="0" r="38" fill="url(#shieldGrad)" stroke="url(#logoGold)" stroke-width="1.8" />
    <circle cx="0" cy="0" r="33" fill="none" stroke="url(#logoGold)" stroke-width="0.75" stroke-dasharray="3 2" opacity="0.6" />
    
    <!-- Star accent -->
    <polygon points="0,-27 2,-23 6,-22 3,-19 4,-15 0,-17 -4,-15 -3,-19 -6,-22 -2,-23" fill="url(#logoGold)" />
    
    <!-- Monogram Y & S -->
    <g transform="translate(0, 5) scale(0.68)">
      <!-- Y -->
      <path d="M-20 -18 L-10 -3 L-10 18 L-4 18 L-4 -3 L6 -18 L0 -18 L-7 -7 L-14 -18 Z" fill="url(#logoGold)" />
      <!-- & -->
      <path d="M-4 -2 Q0 -9 4 -9 Q9 -9 9 -4 Q9 3 -1 8 Q10 9 14 16 Q16 19 14 21 Q11 23 7 20 Q3 16 0 10 Q-4 15 -8 18 Q-12 19 -14 15 Q-15 10 -10 5 Q-3 1 -1 0 Z" fill="none" stroke="url(#logoGold)" stroke-width="2.5" stroke-linecap="round" />
      <!-- S -->
      <path d="M20 -11 Q19 -18 11 -18 Q2 -18 2 -10 Q2 -2 13 2 Q22 6 22 14 Q22 21 12 21 Q2 21 1 13 L6 11.5 Q7 16 12 16 Q16 16 16 12 Q16 7 6 4 Q-3 0 -3 -10 Q-3 -20 11 -20 Q18 -20 22 -12 Z" fill="url(#logoGold)" />
    </g>
  </g>
  
  <!-- Typography Section -->
  <g transform="translate(102, 38)">
    <!-- Primary Latin Brand -->
    <text x="0" y="0" font-family="'Playfair Display', Georgia, serif" font-size="28" font-weight="700" letter-spacing="4" fill="url(#logoGold)">Y&amp;S CHOCOLATE</text>
    
    <!-- Arabic Brand & Subtitle -->
    <text x="3" y="24" font-family="'Cairo', 'Noto Kufi Arabic', sans-serif" font-size="14" font-weight="600" letter-spacing="1.5" fill="#C5A059" opacity="0.95">واي آند إس للشوكولاتة الفاخرة</text>
    
    <!-- Location & Quality Seal -->
    <text x="4" y="40" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="500" letter-spacing="3" fill="#A89680" opacity="0.8">JEDDAH  •  BOUTIQUE DE CHOCOLAT  •  SAUDI ARABIA</text>
  </g>
</svg>

